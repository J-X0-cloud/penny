# XcodeGen spec for the iPhone app. Generate the project with `xcodegen generate` in this folder.
name: Penny
options:
  bundleIdPrefix: com.pennyapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Penny:
    path: ..
targets:
  Penny:
    type: application
    platform: iOS
    sources:
      - path: Penny
      # Goal and category artwork is shared with the website.
      - path: ../static/images
        buildPhase: resources
    dependencies:
      - package: Penny
        product: PennyUI
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennyapp.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Penny/Info.plist
      properties:
        CFBundleDisplayName: Penny
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: Penny uses Face ID to lock your balances every time the app opens.
        # Leave empty to keep everything on the device; set to the server origin to sync.
        PennyAPIBaseURL: ""
